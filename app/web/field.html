<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />

    <title>Действие со сделкой</title>
    <link rel="stylesheet" href="ui.css" />

  <body class="field-page">

        <button id="launch" class="launch-button" hidden></button>

            fill="none"
            stroke="currentColor"

            />
            <circle cx="11" cy="12" r="3" />
          </svg>
        </button>
      </div>
      <div id="message" class="field-message" role="status" aria-live="polite">
        Загрузка…
      </div>
    </main>
    <script src="https://api.bitrix24.com/api/v1/"></script>
    <script src="ui.js"></script>
    <script src="field.js"></script>

</html>
