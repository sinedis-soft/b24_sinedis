<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Настройки кнопки</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body class="settings-page">
    <main id="settings-shell" class="settings-shell">
      <header class="page-header">
        <button id="back" class="back-button">← Назад</button>
        <div>
          <h1>Настройки кнопки</h1>
          <p>Запуск бизнес-процесса из карточки сделки</p>
        </div>
      </header>
      <section class="card">
        <div class="field-picker">
          <label class="control"
            >Поле сделки<input
              id="field"
              class="code-input"
              placeholder="UF_CRM_…"
              maxlength="100" /></label
          ><button id="load">Загрузить</button>
        </div>
      </section>
      <form id="form" hidden>
        <section class="card">
          <h2>Действие</h2>
          <label class="control"
            >Подпись кнопки<input
              id="label"
              maxlength="100"
              required
              placeholder="Например, проверить госномер"
          /></label>
          <label class="control"
            >Номер шаблона процесса<input
              id="template_id"
              type="number"
              min="1"
              required
              placeholder="983"
            /><small
              >Идентификатор шаблона в редакторе бизнес-процессов.</small
            ></label
          >
          <details>
            <summary>Параметры процесса</summary>
            <label class="control"
              >Значения параметров<textarea id="parameters" spellcheck="false">
{}</textarea
              ><small
                >Оставьте {}, если процесс не требует входных параметров.</small
              ></label
            >
          </details>
        </section>
        <section class="card">
          <h2>Внешний вид</h2>
          <div class="grid three">
            <label class="control"
              >Цвет<input id="color" type="color" value="#2563eb"
            /></label>
            <label class="control"
              >Ширина, пкс<input
                id="width"
                type="number"
                min="80"
                max="800"
                value="240"
            /></label>
            <label class="control"
              >Высота, пкс<input
                id="height"
                type="number"
                min="24"
                max="80"
                value="40"
            /></label>
          </div>
          <p class="preview-label">Предварительный просмотр</p>
          <div class="preview-box">
            <button
              id="preview"
              class="launch-button"
              type="button"
              tabindex="-1"
            >
              Запустить бизнес-процесс
            </button>
          </div>
        </section>
        <section class="card">
          <h2>Доступ и повторный запуск</h2>
          <label class="control"
            >Номера сотрудников<input
              id="allowed_user_ids"
              placeholder="Например, 17, 25, 48"
            /><small
              >Через запятую. Пустой список — доступ только
              администраторам.</small
            ></label
          >
          <label class="check"
            ><input id="enabled" type="checkbox" /><span
              ><strong>Разрешить запуск</strong
              ><small
                >Кнопка доступна указанным сотрудникам и администраторам.</small
              ></span
            ></label
          >
          <label class="check"
            ><input id="confirm" type="checkbox" checked /><span
              >Запрашивать подтверждение перед запуском</span
            ></label
          >
          <label class="control"
            >Пауза между запусками, секунд<input
              id="cooldown_seconds"
              type="number"
              min="10"
              max="86400"
              value="30"
          /></label>
          <label class="check"
            ><input id="block_until_released" type="checkbox" /><span
              >Блокировать повторный запуск до ручной разблокировки<small
                >Снять блокировку сможет администратор в журнале.</small
              ></span
            ></label
          >
          <div class="notice">
            Пауза защищает от частых нажатий. Завершение процесса автоматически
            не отслеживается.
          </div>
        </section>
        <div class="form-actions">
          <button id="save" class="primary" type="submit">
            Сохранить настройки
          </button>
        </div>
      </form>
      <p id="message" class="status" role="status" aria-live="polite"></p>
      <section class="card">
        <div class="journal-header">
          <h2>Журнал запусков</h2>
          <button id="journal">Обновить</button>
        </div>
        <div id="records" class="table-scroll"></div>
      </section>
    </main>
    <script src="https://api.bitrix24.com/api/v1/"></script>
    <script src="ui.js"></script>
    <script src="settings.js"></script>
  </body>
</html>
