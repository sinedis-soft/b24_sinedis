[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sinedis-bitrix24-automation"
version = "0.1.0"
description = "Server-side Bitrix24 automation application"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic",
    "asyncpg",
    "cryptography",
    "fastapi",
    "httpx",
    "pydantic-settings",
    "python-multipart",
    "sqlalchemy[asyncio]",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "respx",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
