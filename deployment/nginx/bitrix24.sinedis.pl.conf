server {
    listen 80;
    listen [::]:80;
    server_name bitrix24.sinedis.pl;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bitrix24.sinedis.pl;

    # These standard Certbot paths become valid only after certificate issuance.
    ssl_certificate /etc/letsencrypt/live/bitrix24.sinedis.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bitrix24.sinedis.pl/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
